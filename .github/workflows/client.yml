name: client

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

permissions:
  contents: write

defaults:
  run:
    working-directory: client

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release -p cardmic --target aarch64-apple-darwin
          cargo build --release -p cardmic --target x86_64-apple-darwin
          lipo -create -output cardmic \
            target/aarch64-apple-darwin/release/cardmic \
            target/x86_64-apple-darwin/release/cardmic
          tar czf cardmic-macos-universal.tar.gz cardmic
      - uses: softprops/action-gh-release@v2
        with:
          files: client/cardmic-macos-universal.tar.gz

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release -p cardmic
          Compress-Archive -Path target/release/cardmic.exe -DestinationPath cardmic-windows-x64.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: client/cardmic-windows-x64.zip
