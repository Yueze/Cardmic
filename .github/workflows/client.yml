name: client

on:
  workflow_dispatch:
  push:
    branches: [main, next]
    paths: ["client/**", ".github/workflows/client.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

permissions:
  contents: write

defaults:
  run:
    working-directory: client

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace

  release-macos:
    needs: test
    runs-on: macos-14
    # Signing and notarization, once these secrets exist (Apple Developer
    # Program): MACOS_CERT_P12 (base64 of a "Developer ID Application" .p12),
    # MACOS_CERT_PASSWORD, and an App Store Connect API key for notarytool:
    # NOTARY_KEY_P8 (the .p8 file's text), NOTARY_KEY_ID, NOTARY_ISSUER.
    # Without them the app is signed ad hoc, as before.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Developer ID certificate (when configured)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Menu bar app (Cardmic.app in a disk image)
        run: tray/macos/bundle.sh --universal
      - name: Command-line client
        run: |
          lipo -create -output cardmic \
            target/aarch64-apple-darwin/release/cardmic \
            target/x86_64-apple-darwin/release/cardmic
          tar czf cardmic-macos-universal.tar.gz cardmic
          cp target/macos/Cardmic.dmg Cardmic-macOS.dmg
          # What the app downloads to update itself.
          ditto -c -k --keepParent target/macos/Cardmic.app Cardmic-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cardmic-macos
          path: |
            client/Cardmic-macOS.dmg
            client/Cardmic-macOS.zip
            client/cardmic-macos-universal.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/Cardmic-macOS.dmg
            client/Cardmic-macOS.zip
            client/cardmic-macos-universal.tar.gz

  release-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p cardmic -p cardmic-tray
        shell: pwsh
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" tray\windows\cardmic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\windows\Cardmic-Setup.exe Cardmic-Windows-Setup.exe
          Compress-Archive -Path target/release/cardmic.exe -DestinationPath cardmic-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cardmic-windows
          path: |
            client/Cardmic-Windows-Setup.exe
            client/cardmic-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/Cardmic-Windows-Setup.exe
            client/cardmic-windows-x64.zip

  # The manifest the app checks for updates: the newest version and, per
  # system, where to download it and its SHA-256.
  update-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-macos, release-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: cardmic-app-update.json
        working-directory: dist
        run: |
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          mac_sha=$(sha256sum Cardmic-macOS.zip | cut -d' ' -f1)
          win_sha=$(sha256sum Cardmic-Windows-Setup.exe | cut -d' ' -f1)
          cat > cardmic-app-update.json <<JSON
          {"version": "${tag#v}",
           "macos": {"url": "${base}/Cardmic-macOS.zip", "sha256": "${mac_sha}", "size": $(stat -c%s Cardmic-macOS.zip)},
           "windows": {"url": "${base}/Cardmic-Windows-Setup.exe", "sha256": "${win_sha}", "size": $(stat -c%s Cardmic-Windows-Setup.exe)}}
          JSON
          cat cardmic-app-update.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/cardmic-app-update.json

