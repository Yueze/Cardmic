[package]
name = "cardmic-tray"
description = "Cardmic menu bar (macOS) and tray (Windows) app"
version.workspace = true
edition.workspace = true
license.workspace = true
# tray-icon and muda need 1.90
rust-version = "1.90"

[[bin]]
# Not "Cardmic": it would collide with the `cardmic` CLI in target/ on
# case-insensitive file systems (macOS, Windows). Packaging renames it.
name = "cardmic-app"
path = "src/main.rs"

[dependencies]
# Self-update from GitHub Releases, like the firmware: HTTPS, the manifest,
# and a SHA-256 check of what was downloaded.
serde_json = "1"
sha2 = "0.11"
ureq = "3"
cardmic-core.workspace = true
cardmic-audio.workspace = true
cardmic-engine.workspace = true
cpal.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.25"
tao = "0.37"
# The window: HTML drawn by the system's web view (WKWebView, WebView2).
wry = { version = "0.57", default-features = false }
# Reading the Cardputer's identity report over USB, to pair by plugging in.
# Shared: the report is only read, never the device taken over.
hidapi = { version = "2", default-features = false, features = ["macos-shared-device", "windows-native"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSProcessInfo", "NSString", "NSUserDefaults"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
