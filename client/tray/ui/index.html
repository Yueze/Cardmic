<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardmic</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { cursor: default; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 520px; height: 520px; image-rendering: pixelated; }
</style>
<!-- In the app, the fonts come in as an initialization script instead. -->
<script src="fonts.js"></script>
</head>
<body>
<canvas id="screen"></canvas>
<script>
  // Page errors go to the app's log (Cardmic.log), for support.
  window.addEventListener("error", (e) => {
    if (window.ipc) window.ipc.postMessage("log\t" + e.message + " @" + e.lineno);
  });
</script>
<script>
/*
 * The Cardmic window, drawn the way the Cardputer draws its screen: a
 * 260x260 grid of device pixels, 2 CSS pixels each, the device's palette and
 * bitmap fonts (glcdfont, DejaVu 12, Orbitron Light 24), its spectrogram and
 * its segmented meter. Rust pushes state ~10 times a second; clicks and keys
 * go back as one-line commands.
 */
(() => {
  const S = 2, W = 260, H = 260;
  const C = {
    bg: "#000000", text: "#F2F2F2", dim: "#6E6E6E", faint: "#262626", row: "#121212",
    label: "#B8B8B8", accent: "#99FF00", cyan: "#28F0FF", warn: "#FFB020", mute: "#FF4A4A",
  };

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  let K = 2;
  const cache = new Map(); // rendered text, see cached()
  function resize() {
    K = S * (window.devicePixelRatio || 1);
    cache.clear();
    canvas.width = W * K;
    canvas.height = H * K;
    ctx.imageSmoothingEnabled = false;
  }
  resize();
  window.addEventListener("resize", resize);

  const send = (cmd, arg) => {
    const msg = arg === undefined ? cmd : cmd + "\t" + arg;
    if (window.ipc) window.ipc.postMessage(msg); else console.log("ipc:", msg);
  };

  // ------------------------------------------------------------ drawing

  // `g` is where pixels go: the screen, or a text cache while one is filled.
  let g = ctx;
  const rect = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x * K, y * K, w * K, h * K); };
  const px = (x, y) => g.fillRect(x * K, y * K, K, K);

  // Rendered text, kept as small images: drawing a string pixel by pixel
  // every frame costs far more than copying it.
  function cached(key, x, y, w, h, draw) {
    let img = cache.get(key);
    if (!img) {
      if (cache.size > 400) cache.clear();
      img = document.createElement("canvas");
      img.width = Math.max(1, w * K); img.height = Math.max(1, h * K);
      const saved = g;
      g = img.getContext("2d");
      draw();
      g = saved;
      cache.set(key, img);
    }
    ctx.drawImage(img, x * K, y * K);
  }

  // Pixel circles, as the device draws them.
  function fillCircle(cx, cy, r, col) {
    g.fillStyle = col;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.8) px(cx + x, cy + y);
  }
  function drawCircle(cx, cy, r, col) {
    g.fillStyle = col;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      if (Math.abs(Math.sqrt(x * x + y * y) - r) < 0.55) px(cx + x, cy + y);
    }
  }

  const FONTS = window.CARDMIC_FONTS;
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const font0 = b64(FONTS.font0.data);
  function gfx(f) {
    const bits = b64(f.bitmap);
    let ascent = 0, descent = 0;
    for (const gl of f.glyphs) { ascent = Math.max(ascent, -gl[5]); descent = Math.max(descent, gl[5] + gl[2]); }
    return { ...f, bits, ascent, height: ascent + descent };
  }
  const DEJAVU = gfx(FONTS.dejavu12), ORBITRON = gfx(FONTS.orbitron24);
  const ascii = (s) => /^[\x20-\x7e]*$/.test(s);

  // Font0: 6x8 cells, top-left at (x, y).
  function t0(s, x, y, col) {
    if (!s) return;
    cached("0|" + col + "|" + s, x, y, s.length * 6, 8, () => {
      g.fillStyle = col;
      for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i) & 0xff;
        for (let cx = 0; cx < 5; cx++) {
          const byte = font0[c * 5 + cx];
          for (let cy = 0; cy < 8; cy++) if (byte & (1 << cy)) px(i * 6 + cx, cy);
        }
      }
    });
  }
  const w0 = (s) => Math.max(0, s.length * 6 - 1);
  const fit0 = (s, max) => (w0(s) <= max ? s : s.slice(0, Math.max(1, Math.floor((max + 1) / 6) - 2)) + "..");

  // Names in other scripts (扬声器 ...) have no bitmap: the system font draws them.
  function tsys(s, x, y, col, size) {
    g.fillStyle = col;
    g.font = `${size * K}px -apple-system, "Segoe UI", sans-serif`;
    g.textBaseline = "top";
    g.fillText(s, x * K, y * K);
    return x + Math.ceil(g.measureText(s).width / K);
  }

  // Adafruit GFX fonts, top of the tallest glyph at y.
  function tg(f, s, x, y, col) {
    if (!ascii(s)) return tsys(s, x, y - 1, col, f === ORBITRON ? 20 : 11);
    const w = wg(f, s);
    cached((f === ORBITRON ? "o|" : "d|") + col + "|" + s, x, y, w + 2, f.height, () => {
      g.fillStyle = col;
      let cx = 0;
      for (const ch of s) {
        const gl = f.glyphs[ch.charCodeAt(0) - f.first];
        if (!gl) continue;
        const [off, gw, gh, xa, xo, yo] = gl;
        let bit = 0;
        for (let yy = 0; yy < gh; yy++) for (let xx = 0; xx < gw; xx++, bit++) {
          const b = off * 8 + bit;
          if (f.bits[b >> 3] & (0x80 >> (b & 7))) px(cx + xo + xx, f.ascent + yo + yy);
        }
        cx += xa;
      }
    });
    return x + w;
  }
  function wg(f, s) {
    if (!ascii(s)) {
      ctx.font = `${(f === ORBITRON ? 20 : 11) * K}px -apple-system, "Segoe UI", sans-serif`;
      return Math.ceil(ctx.measureText(s).width / K);
    }
    let w = 0;
    for (const ch of s) { const g = f.glyphs[ch.charCodeAt(0) - f.first]; if (g) w += g[3]; }
    return w;
  }
  function fit(f, s, max) {
    if (wg(f, s) <= max) return s;
    while (s.length > 1 && wg(f, s + "..") > max) s = s.slice(0, -1);
    return s + "..";
  }
  const right = (f, s, xr, y, col) => tg(f, s, xr - wg(f, s), y, col);

  function keycap(x, y, key, label) {
    const kw = w0(key) + 5;
    rect(x, y, kw, 10, C.text);
    for (const [cx, cy] of [[0, 0], [kw - 1, 0], [0, 9], [kw - 1, 9]]) rect(x + cx, y + cy, 1, 1, C.bg);
    t0(key, x + 3, y + 1, C.bg);
    x += kw + 3;
    t0(label, x, y + 1, C.dim);
    return x + w0(label) + 7;
  }

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (sh) => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }

  function ramp(stops, t) {
    let k = 1;
    while (k < stops.length - 1 && t > stops[k][0]) k++;
    const [a0, c0] = stops[k - 1], [a1, c1] = stops[k];
    const u = Math.min(1, Math.max(0, (t - a0) / (a1 - a0)));
    const ch = (sh) => Math.round(((c0 >> sh) & 255) * (1 - u) + ((c1 >> sh) & 255) * u);
    return [ch(16), ch(8), ch(0)];
  }

  // ------------------------------------------------------------ spectrogram

  // The device's palette: black below the noise floor, then its heat ramp.
  const SPEC_STOPS = [[0, 0x000000], [0.14, 0x0d1fb0], [0.32, 0x2f6bff], [0.5, 0x28f0ff], [0.68, 0x99ff00], [0.84, 0xffd000], [1, 0xff3b3b]];
  const PALETTE = Array.from({ length: 256 }, (_, i) => ramp(SPEC_STOPS, i / 255));
  const BANDS = 62, SPEC_W = 256, SPEC_X = 2, SPEC_Y = 22;
  const spec = document.createElement("canvas");
  spec.width = SPEC_W; spec.height = BANDS;
  const sctx = spec.getContext("2d");
  sctx.fillStyle = "#000"; sctx.fillRect(0, 0, SPEC_W, BANDS);
  const queue = [];   // columns waiting to scroll in, at 100 per second like the device
  let specDebt = 0, lastFrame = performance.now();

  function addColumns(hex) {
    for (let i = 0; i + BANDS * 2 <= hex.length; i += BANDS * 2) {
      const col = new Uint8Array(BANDS);
      for (let r = 0; r < BANDS; r++) col[r] = parseInt(hex.substr(i + r * 2, 2), 16);
      queue.push(col);
    }
    if (queue.length > 60) queue.splice(0, queue.length - 30); // fell behind: skip ahead
  }
  function scrollSpectrogram(now) {
    specDebt += (now - lastFrame) / 10;
    lastFrame = now;
    const n = Math.min(Math.floor(specDebt), queue.length);
    if (n <= 0) { if (!queue.length) specDebt = Math.min(specDebt, 1); return; }
    specDebt -= n;
    sctx.drawImage(spec, -n, 0);
    const img = sctx.createImageData(n, BANDS);
    for (let c = 0; c < n; c++) {
      const col = queue.shift();
      for (let r = 0; r < BANDS; r++) {
        const [rr, gg, bb] = PALETTE[col[r]];
        const o = ((BANDS - 1 - r) * n + c) * 4;
        img.data[o] = rr; img.data[o + 1] = gg; img.data[o + 2] = bb; img.data[o + 3] = 255;
      }
    }
    sctx.putImageData(img, SPEC_W - n, 0);
  }

  // ------------------------------------------------------------ meter

  const SEGS = 16;
  const HEAT = [[0, 0x1b2a6b], [0.22, 0x2f6bff], [0.42, 0x28f0ff], [0.62, 0x99ff00], [0.8, 0xffd000], [1, 0xff3b3b]];
  const heat = (t) => { const [r, g, b] = ramp(HEAT, t); return `rgb(${r},${g},${b})`; };
  let meter = 0, peakHold = 0, peakAt = 0, dbShown = -60, dbAt = 0, lastLevel = 0, lastLevelAt = 0;
  function stepMeter(level, now) {
    if (now - lastLevelAt < 30) return; // ballistics at the device's pace
    lastLevelAt = now;
    const db = 20 * Math.log10(Math.max(level, 1e-6));
    const target = Math.min(1, Math.max(0, (db + 60) / 60)); // -60..0 dBFS
    meter = target > meter ? target : meter * 0.9 + target * 0.1;
    if (meter >= peakHold || now - peakAt > 1000) {
      peakHold = meter >= peakHold ? meter : Math.max(meter, peakHold - 0.02);
      if (meter >= peakHold) peakAt = now;
    }
    if (now - dbAt > 250) { dbShown = Math.round(meter * 60 - 60); dbAt = now; }
  }
  function drawMeter(x, y) {
    const lit = Math.round(meter * SEGS);
    const peak = Math.min(SEGS - 1, Math.round(peakHold * SEGS));
    for (let i = 0; i < SEGS; i++) {
      let col = i < lit ? heat((i + 0.5) / SEGS) : C.faint;
      if (i === peak && peak > 0) col = C.text;
      rect(x + i * 5, y, 4, 8, col);
    }
    const s = dbShown + " DB";
    t0(s, x + SEGS * 5 - 1 - w0(s), y + 12, C.dim);
  }

  // ------------------------------------------------------------ state

  let state = { phase: "starting", title: "", detail: "" };
  let sel = 0;             // selected row
  let entry = null;        // pairing code being typed, or null
  let entryError = "";
  let copiedAt = -1e9;
  let rows = [];           // this frame's rows: {y, h, i, act}
  let hits = [];           // other clickable rects

  function rowList() {
    const s = state, list = [];
    const fix = {
      no_loopback: ["Install " + (s.install_name || "a virtual device"), () => send("open", "install")],
      mic_denied: ["Allow microphone access", () => send("open", "privacy")],
      busy: ["Try again", () => send("retry")],
      failed: ["Try again", () => send("retry")],
      wrong_code: ["Enter the new code", () => startEntry()],
    }[s.phase];
    if (fix) list.push({ label: "Fix", value: fix[0], col: C.warn, act: fix[1] });
    const live = s.phase === "connected";
    const mic = live ? s.mic : (s.usb || s.mic);
    list.push({
      label: "Microphone", value: performance.now() - copiedAt < 1200 ? "COPIED" : (mic || "-"),
      col: mic && (live || s.usb) ? C.accent : C.dim,
      act: mic ? () => { send("copy", mic); copiedAt = performance.now(); } : null,
    });
    list.push({
      label: "Wi-Fi",
      value: !s.wifi ? "OFF" : live ? s.device : s.phase === "searching" ? "SEARCHING" : s.phase === "starting" ? "STARTING" : "NOT LINKED",
      col: !s.wifi ? C.dim : live ? C.accent : C.warn,
      act: () => send("wifi", s.wifi ? "0" : "1"),
    });
    list.push({ label: "USB", value: s.usb ? "PLUGGED IN" : "-", col: s.usb ? C.accent : C.dim, act: null });
    list.push({
      label: "Pairing", value: s.paired ? (live && s.encrypted ? "ENCRYPTED" : "ON") : "OFF",
      col: s.paired ? C.accent : C.dim, act: () => startEntry(),
    });
    const outs = [""].concat((s.outputs || []).map((o) => o.name));
    const cur = s.manual ? (s.output || "") : "";
    list.push({
      label: "Play into", value: s.manual ? (s.output || "-") : "AUTO" + (s.output ? "  " + s.output : ""),
      col: C.text,
      act: outs.length > 1 ? () => send("output", outs[(outs.indexOf(cur) + 1) % outs.length]) : null,
    });
    list.push({
      label: s.platform === "win" ? "Start with Windows" : "Open at login", value: s.login ? "ON" : "OFF",
      col: s.login ? C.accent : C.dim, act: () => send("login", s.login ? "0" : "1"),
    });
    return list;
  }

  function startEntry() { entry = ""; entryError = ""; }

  // ------------------------------------------------------------ frame

  function frame(now) {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hits = [];
    rows = [];
    const s = state, mac = s.platform !== "win";
    const live = s.phase === "connected";

    // Top row: title, then the device's link lights.
    const x0 = mac ? 40 : 2;
    t0("CARDMIC", x0, 5, C.accent);
    if (s.version) t0("V" + s.version, x0 + w0("CARDMIC") + 6, 5, C.dim);
    const light = (x, col, label, flowing) => {
      if (flowing) drawCircle(x + 3, 8, 5, mix(C.bg, col, 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(now * 0.0063))));
      fillCircle(x + 3, 8, 3, col);
      t0(label, x + 11, 5, col);
    };
    const seeking = s.phase === "searching" || s.phase === "starting";
    const wifiCol = !s.wifi ? C.dim : live ? C.accent : seeking ? (Math.floor(now / 350) % 2 ? C.warn : C.faint) : C.warn;
    light(W - 2 - 72, s.usb ? C.accent : C.dim, "USB", false);
    light(W - 2 - 36, wifiCol, "WIFI", live && (s.level || 0) > 0.002);

    // Spectrogram, with the device's log-frequency ticks.
    scrollSpectrogram(now);
    ctx.drawImage(spec, SPEC_X * K, SPEC_Y * K, SPEC_W * K, BANDS * K);
    for (const [hz, lab] of [[4000, "4K"], [1000, "1K"], [250, "250"]]) {
      const y = SPEC_Y + BANDS - 1 - Math.floor(BANDS * Math.log(hz / 100) / Math.log(80));
      rect(SPEC_X, y, 3, 1, C.dim);
      t0(lab, SPEC_X + 5, y - 3, C.dim);
    }

    // State word and meter, as on the device's main screen.
    const word = {
      connected: ["LIVE", C.accent], searching: ["SEARCH", C.dim], starting: ["WAIT", C.dim],
      off: s.usb ? ["USB", C.accent] : ["IDLE", C.dim], wrong_code: ["PAIR", C.warn],
    }[s.phase] || ["SETUP", C.warn];
    tg(ORBITRON, word[0], 2, 92, word[1]);
    stepMeter(live ? (s.level || 0) : 0, now);
    drawMeter(W - 2 - SEGS * 5 + 1, 93);

    const detail = live ? `CARDPUTER AT ${s.device}  ${s.encrypted ? "ENCRYPTED" : "NOT ENCRYPTED"}` : (s.detail || "").toUpperCase();
    const dcol = !live && word[1] === C.warn ? C.warn : C.dim;
    if (ascii(detail)) t0(fit0(detail, W - 4), 2, 120, dcol); else tsys(detail, 2, 119, dcol, 9);

    if (entry !== null) drawEntry(now); else drawRows();

    // Key hints and stats along the bottom, like the device.
    let hx = 2;
    const hy = H - 13;
    if (entry !== null) {
      hx = keycap(hx, hy, "ENT", "PAIR");
      keycap(hx, hy, "ESC", "BACK");
    } else {
      hx = keycap(hx, hy, "\x18\x19", "MOVE");
      keycap(hx, hy, "ENT", "OPEN");
    }
    const stats = live ? `BUF ${Math.round(s.buffer_ms || 0)}MS  LOSS ${(s.loss_pct || 0).toFixed(1)}%` : "";
    t0(stats, W - 2 - w0(stats), hy + 1, C.dim);

    requestAnimationFrame(frame);
  }

  function drawRows() {
    const list = rowList();
    sel = Math.min(sel, list.length - 1);
    const top = 134, rh = 14;
    t0("SETTINGS", 2, top, C.accent);
    const pos = String(sel + 1).padStart(2, "0") + "/" + String(list.length).padStart(2, "0");
    t0(pos, W - 2 - w0(pos), top, C.dim);
    list.forEach((r, i) => {
      const y = top + 11 + i * rh;
      const on = i === sel;
      if (on) { rect(0, y, W, rh, C.row); rect(0, y, 3, rh, C.accent); }
      t0(String(i + 1).padStart(2, "0"), 7, y + 3, on ? C.accent : C.dim);
      tg(DEJAVU, r.label, 24, y + 2, on ? C.text : C.label);
      const room = W - 4 - 24 - wg(DEJAVU, r.label) - 10;
      right(DEJAVU, fit(DEJAVU, r.value, room), W - 4, y + 2, r.col);
      rows.push({ y, h: rh, i, act: r.act });
    });
  }

  function drawEntry(now) {
    const top = 134;
    t0("PAIRING", 2, top, C.accent);
    t0("TYPE THE CODE FROM CARDMIC > SETTINGS > PAIRING", 2, top + 14, C.dim);
    rect(2, top + 27, W - 4, 20, C.row);
    rect(2, top + 27, 3, 20, C.accent);
    const shown = entry.replace(/(.{4})(?=.)/g, "$1-");
    if (!entry) tg(DEJAVU, "XXXX-XXXX-XXXX", 10, top + 32, C.faint);
    const ex = entry ? tg(DEJAVU, shown, 10, top + 32, C.text) : 10;
    if (Math.floor(now / 500) % 2) rect(ex + 1, top + 31, 1, 12, C.accent);
    if (entryError) t0(fit0(entryError.toUpperCase(), W - 4), 2, top + 53, C.mute);
    else if (state.paired) t0("A NEW CODE REPLACES THE CURRENT ONE", 2, top + 53, C.dim);
  }

  // ------------------------------------------------------------ input

  const at = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / S, (e.clientY - r.top) / S]; };
  const inside = (h, x, y) => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h;
  canvas.addEventListener("mousemove", (e) => {
    const [x, y] = at(e);
    const row = entry === null && rows.find((r) => y >= r.y && y < r.y + r.h);
    if (row) sel = row.i;
    canvas.style.cursor = (row && row.act) || hits.some((h) => inside(h, x, y)) ? "pointer" : "default";
  });
  canvas.addEventListener("mousedown", (e) => {
    const [x, y] = at(e);
    const hit = hits.find((h) => inside(h, x, y));
    if (hit) return hit.act();
    const row = entry === null && rows.find((r) => y >= r.y && y < r.y + r.h);
    if (row) { sel = row.i; if (row.act) row.act(); return; }
    if (y < 18) send("drag"); // the top row is the title bar
  });
  document.addEventListener("keydown", (e) => {
    if (entry !== null) {
      if (e.key === "Escape") entry = null;
      else if (e.key === "Enter") send("pair", entry);
      else if (e.key === "Backspace") { entry = entry.slice(0, -1); entryError = ""; }
      else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
        const c = e.key.toUpperCase().replace(/[^0-9A-Z]/g, "");
        if (c && entry.length < 12) { entry += c; entryError = ""; }
      }
      return;
    }
    const list = rowList();
    if (e.key === "ArrowUp" || e.key === ";") sel = Math.max(0, sel - 1);
    else if (e.key === "ArrowDown" || e.key === ".") sel = Math.min(list.length - 1, sel + 1);
    else if (e.key === "Enter" || e.key === " ") { const r = list[sel]; if (r && r.act) r.act(); }
    else if (e.key === "h" || e.key === "H") send("open", "help");
  });
  document.addEventListener("paste", (e) => {
    if (entry === null) return;
    entry = (entry + (e.clipboardData.getData("text") || "").toUpperCase().replace(/[^0-9A-Z]/g, "")).slice(0, 12);
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // ------------------------------------------------------------ from Rust

  function update(s) {
    if (s.spec) addColumns(s.spec);
    delete s.spec;
    state = s;
  }
  function pairResult(ok, message) {
    if (ok) { entry = null; entryError = ""; } else entryError = message;
  }
  window.cardmic = { update, pairResult, focusPair: startEntry };
  requestAnimationFrame(frame);

  if (!window.ipc) {
    // Demo mode: opened in a browser, not in the app.
    let t = 0;
    setInterval(() => {
      t++;
      const speaking = Math.sin(t / 7) > -0.1;
      let hex = "";
      for (let c = 0; c < 10; c++) {
        const f0 = 8 + 4 * Math.sin((t * 10 + c) / 9);
        for (let r = 0; r < BANDS; r++) {
          let v = Math.random() < 0.08 ? Math.random() * 60 : 0;
          if (speaking) for (let h = 1; h <= 5; h++) {
            const d = Math.abs(r - (f0 + h * 7));
            if (d < 2.5) v = Math.max(v, 230 - d * 60 - h * 18 + Math.random() * 30);
          }
