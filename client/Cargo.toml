[workspace]
resolver = "2"
members = ["core", "audio", "engine", "app", "tray", "synth"]

[workspace.package]
version = "0.6.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Yueze/Cardmic"

[workspace.dependencies]
cardmic-core = { path = "core" }
cardmic-audio = { path = "audio" }
cardmic-engine = { path = "engine" }
# cpal 0.18 is a hard floor: 0.18.0 removed DeviceTrait::name(), changed
# sample_rate() to u32 and build_*_stream to take StreamConfig by value.
# It also postdates the 0.17.2/0.17.3 Communications-device regression on
# Windows, which is the device class this product targets.
cpal = "0.18.2"
